lo{color:#f0f6fc;font-size:1.8rem;font-weight:700;text-align:center;margin-bottom:6px}.menu-subtitulo{color:#8b949e;font-size:.85rem;text-align:center;margin-bottom:12px}.btn-siguiente{background:#238636;border:none;border-radius:20px;padding:10px 12px;font-weight:700;font-size:.85rem;color:#fff;box-shadow:0 4px 0 #166b2c;cursor:pointer;touch-action:manipulation;margin-top:4px}.btn-siguiente:active{transform:translateY(2px);box-shadow:0 2px 0 #166b2c}.btn-siguiente:disabled{opacity:.4;transform:none;box-shadow:0 4px 0 #166b2c;pointer-events:none}.dev-panel{background:#1a1a2e;border-radius:20px;padding:14px;border:1px solid #4e54c8;color:#e0e7ff;display:flex;flex-direction:column;gap:10px}.dev-panel input,.dev-panel select{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:8px;border-radius:10px;font-size:.8rem;width:100%}.dev-panel button{background:#238636;border:none;border-radius:12px;padding:8px;font-weight:700;color:#fff;cursor:pointer;touch-action:manipulation}.dev-panel button:active{background:#166b2c}.video-contenedor{position:relative;width:100%;max-width:400px;margin-bottom:20px;border-radius:16px;overflow:hidden;box-shadow:0 12px 24px rgba(0,0,0,0.5)}.video-contenedor video{width:100%;display:block}.btn-iniciar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:#38bdf8;color:#0f172a;border:none;padding:14px 35px;border-radius:30px;font-size:1.1rem;font-weight:700;cursor:pointer;box-shadow:0 6px 0 #0e7490;touch-action:manipulation}.btn-iniciar:active{transform:translateX(-50%) translateY(3px);box-shadow:0 2px 0 #0e7490}</style></head><body><div class="splash-screen" id="splashScreen"><div id="bloqueVideoIntro" class="video-contenedor"><video id="videoIntro" playsinline webkit-playsinline controls muted><source src="https://github.com/maikermedina1999-bot/Proyecto/raw/0f66b2805df674bbb1bd725735ba6ba9c08731a8/soyyo.mp4" type="video/mp4">Tu navegador no soporta videos.</video><button id="btnIniciar" class="btn-iniciar">▶ Entrar</button></div><div id="bloqueTextosUnexpo" style="display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center"><svg class="splash-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="45" fill="none" stroke="#38bdf8" stroke-width="4"/><path d="M30 70 L50 25 L70 70 Z" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round"/><circle cx="50" cy="52" r="8" fill="#38bdf8"/><line x1="50" y1="20" x2="50" y2="12" stroke="#38bdf8" stroke-width="3"/><line x1="28" y1="38" x2="22" y2="32" stroke="#38bdf8" stroke-width="3"/><line x1="72" y1="38" x2="78" y2="32" stroke="#38bdf8" stroke-width="3"/></svg><div class="splash-titulo">Universidad Nacional Experimental Politécnica<br>"Antonio José de Sucre"</div><div class="splash-subtitulo">Desarrollado para la Sección de M2</div></div></div><div class="contenedor" id="contenedorPrincipal"></div><script>(function(){const splash=document.getElementById("splashScreen");const cont=document.getElementById("contenedorPrincipal");let estado={modo:null,pasos:[],pasoActualRaw:"",ejercicio:null,puntos:0,nivel:0,puntosParaSubir:10,ultimoCaso:null,ejerciciosPersonalizados:[],bloqueado:!1,modoTutorial:!1};function actMeta(){estado.puntosParaSubir=Math.round(10*Math.pow(1.3,estado.nivel))}function guardarProgreso(){try{const datos={nivel:estado.nivel,puntos:estado.puntos,puntosParaSubir:estado.puntosParaSubir,modoTutorial:estado.modoTutorial};localStorage.setItem("ab_prog",JSON.stringify(datos));localStorage.setItem("ab_ejer",JSON.stringify(estado.ejerciciosPersonalizados))}catch(e){}}function cargarProgreso(){try{const p=localStorage.getItem("ab_prog");if(p){const d=JSON.parse(p);estado.nivel=d.nivel||0;estado.puntos=d.puntos||0;estado.puntosParaSubir=d.puntosParaSubir||10;estado.modoTutorial=d.modoTutorial||!1}const e=localStorage.getItem("ab_ejer");if(e){estado.ejerciciosPersonalizados=JSON.parse(e)||[]}}catch(e){}actMeta()}function mcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){let t=b;b=a%b;a=t}return a}function reparar(str){if(!str)return"";let s=str.replace(/\s+/g,"");s=s.replace(/(\d|[a-zA-Z])\(/g,"$1*(");s=s.replace(/\)(\d|[a-zA-Z])/g,")*$1");s=s.replace(/\)\(/g,")*(");return s}function extraerParteAlgebraica(expr){return expr.replace(/lim\s*x\s*->\s*\d+\s*/g,"").trim()}function verificarEq(a,b,modo){try{let u=a,o=b;if(modo===4){u=extraerParteAlgebraica(a);o=extraerParteAlgebraica(b)}u=reparar(u.toLowerCase());o=reparar(o.toLowerCase());const res=Algebrite.simplify(`(${u}) - (${o})`).toString();return res.replace(/\s/g,"")==="0"}catch(e){return!1}}function rand(){return Math.floor(Math.random()*5)+2}function variable(){return["x","y"][Math.floor(Math.random()*2)]}function aLaTeX(expr){if(!expr)return"";let e=expr.replace(/lim\s*x\s*->\s*(\d+)/g,(m,k)=>`\\lim_{x \\to ${k}}`);e=e.replace(/\^(\d+)/g,"^{$1}");e=e.replace(/\*/g," \\cdot ");e=e.replace(/\//g," \\div ");return e}function obtenerPersonalizados(){try{const raw=localStorage.getItem("ab_ejer");const arr=JSON.parse(raw);return Array.isArray(arr)?arr:[]}catch(e){return[]}}function generarEjercicio(){const personalizados=obtenerPersonalizados().filter(e=>e.modo===estado.modo);if(personalizados.length>0){const idx=Math.floor(Math.random()*personalizados.length);const elegido=personalizados[idx];return{obj:elegido.obj,sol:elegido.sol,objLatex:`\\(${elegido.obj.replace(/\*/g,"\\cdot ").replace(/\//g,"\\div ")}\\)`,pista:elegido.pista||"Resuelve el ejercicio personalizado.",tutorialHtml:elegido.tutorialHtml||null,k:elegido.k||null}}switch(estado.modo){case 1:return genModo1();case 2:return genModo2();case 3:return genModo3();case 4:return genModo4();case 5:return genModo5();default:return genModo1()}}function genModo1(){const cs=["A","B","C","D"];if(estado.ultimoCaso&&cs.length>1)cs.splice(cs.indexOf(estado.ultimoCaso),1);const caso=cs[Math.floor(Math.random()*cs.length)];estado.ultimoCaso=caso;const k1=rand(),k2=rand(),v1=variable(),v2=variable();if(caso==="A"){const a=k1,b=k2,c=k1*a,d=k2*b;const f=mcd(c,d);return{obj:`${c}${v1} + ${d}${v2}`,sol:`${f}*(${c/f}${v1} + ${d/f}${v2})`,objLatex:`\\(${c}${v1} + ${d}${v2}\\)`,pista:`Factor común MCD(${c},${d}) = ${f}`,tutorialHtml:`<strong>🔍 Caso: Factor Común</strong><br>Identifica el MCD de los coeficientes (${c} y ${d}) que es <strong>${f}</strong>. Extrae ese factor común y escribe los términos divididos dentro de un paréntesis: \\(${f} \\cdot (\\frac{${c}}{${f}}${v1} + \\frac{${d}}{${f}}${v2})\\).`,k:null}}else if(caso==="B"){const k=k1,b=2*k,c=k*k;const sig=k2%2===0?"+":"-";return{obj:`${v1}^2 ${sig} ${b}${v1} + ${c}`,sol:`(${v1}${sig==="+"?"+":"-"}${k})^2`,objLatex:`\\(${v1}^{2} ${sig} ${b}${v1} + ${c}\\)`,pista:`TCP (${v1}${sig==="+"?"+":"-"}${k})^{2}`,tutorialHtml:`<strong>🔍 Caso: Trinomio Cuadrado Perfecto</strong><br>Verifica que el primer término (\\(${v1}^2\\)) y el tercero (\\(${c}\\)) tengan raíces cuadradas perfectas: \\(\\sqrt{${v1}^2}=${v1}\\) y \\(\\sqrt{${c}}=${k}\\). El término central debe ser \\(2 \\cdot ${v1} \\cdot ${k} = ${b}${v1}\\). Como coincide, factoriza como \\((${v1} ${sig} ${k})^{2}\\).`,k:null}}else if(caso==="C"){const k=k1,c=k*k;return{obj:`${v1}^2 - ${c}`,sol:`(${v1}+${k})*(${v1}-${k})`,objLatex:`\\(${v1}^{2} - ${c}\\)`,pista:`Diferencia de cuadrados √${c}=${k}`,tutorialHtml:`<strong>🔍 Caso: Diferencia de Cuadrados</strong><br>Tienes \\(${v1}^2 - ${c}\\). Ambos son cuadrados perfectos: \\(\\sqrt{${v1}^2}=${v1}\\) y \\(\\sqrt{${c}}=${k}\\). Usa la fórmula \\(a^2 - b^2 = (a+b)(a-b)\\): \\((${v1}+${k})(${v1}-${k})\\).`,k:null}}else{const r1=k1,r2=k2;const b=r1+r2,c=r1*r2;const sb=b>=0?"+":"-";const sc=c>=0?"+":"-";return{obj:`${v1}^2 ${sb} ${Math.abs(b)}${v1} ${sc} ${Math.abs(c)}`,sol:`(${v1}+${r1})*(${v1}+${r2})`,objLatex:`\\(${v1}^{2} ${sb} ${Math.abs(b)}${v1} ${sc} ${Math.abs(c)}\\)`,pista:`Suma ${b} y producto ${c}: ${r1} y ${r2}`,tutorialHtml:`<strong>🔍 Caso: Trinomio de la forma \\(x^2 + bx + c\\)</strong><br>Busca dos números que multiplicados den <strong>${c}</strong> y sumados den <strong>${b}</strong>. Esos números son <strong>${r1}</strong> y <strong>${r2}</strong>. La factorización es \\((${v1}+${r1})(${v1}+${r2})\\).`,k:null}}}function genModo2(){const k=rand(),v=variable();return{obj:`(${v} + ${k})^2`,sol:`${v}^2 + ${2*k}${v} + ${k*k}`,objLatex:`\\((${v} + ${k})^{2}\\)`,pista:`Expande (a+b)² = a² + 2ab + b²`,tutorialHtml:null,k:null}}function genModo3(){const ops=[{obj:"(sin(x))^2 + (cos(x))^2",sol:"1",objLatex:"\\(\\sin^{2}(x) + \\cos^{2}(x)\\)",pista:"Identidad fundamental sin²+cos²=1"},{obj:"1 - (sin(x))^2",sol:"(cos(x))^2",objLatex:"\\(1 - \\sin^{2}(x)\\)",pista:"cos² = 1 - sin²"},{obj:"tan(x) * cos(x)",sol:"sin(x)",objLatex:"\\(\\tan(x) \\cdot \\cos(x)\\)",pista:"tan = sin/cos"}];const el=ops[Math.floor(Math.random()*ops.length)];return{...el,tutorialHtml:null,k:null}}function genModo4(){const k=rand();return{obj:`lim x->${k} (x^2 - ${k*k})/(x - ${k})`,sol:`${2*k}`,objLatex:`\\(\\lim_{x \\to ${k}} \\frac{x^{2} - ${k*k}}{x - ${k}}\\)`,pista:`Factoriza (x²-${k*k})=(x+${k})(x-${k}) y cancela`,tutorialHtml:null,k:k}}function genModo5(){const k=rand(),v=variable();return{obj:`${k}${v}^3 + ${k*2}${v}^2`,sol:`${3*k}${v}^2 + ${2*k*2}${v}`,objLatex:`\\(${k}${v}^{3} + ${k*2}${v}^{2}\\)`,pista:`Deriva cada término: n·xⁿ⁻¹`,tutorialHtml:null,k:null}}function textoAcademia(){const t=["","Factorización: Saca factor común, TCP, diferencia de cuadrados y trinomios.","Productos Notables: Expande binomios. \\( (a+b)^{2} = a^{2}+2ab+b^{2} \\)","Trigonometría: Simplifica identidades.","Límites: Resuelve 0/0 por factorización. Sigue los 3 pasos.","Derivadas: \\( \\frac{d}{dx}x^{n}=n·x^{n-1} \\)"];return t[estado.modo]||""}function extrasTeclado(){if(estado.modo===3)return["sin","cos","tan"];if(estado.modo===4)return["lim x->"];return[]}function sumarPuntos(c){estado.puntos+=c;if(estado.puntos>=estado.puntosParaSubir){estado.puntos-=estado.puntosParaSubir;estado.nivel++;actMeta();const fb=document.getElementById("feedback");if(fb)fb.textContent=`🎉 ¡Subiste al Nivel ${estado.nivel}!`}actualizarBarra();guardarProgreso()}function actualizarBarra(){const b=document.getElementById("barraProgreso");if(!b)return;const pct=Math.min(100,Math.round(estado.puntos/estado.puntosParaSubir*100));b.style.width=pct+"%";b.textContent=pct>15?`${estado.puntos}/${estado.puntosParaSubir}`:"";const badge=document.getElementById("badgeModo");if(badge)badge.textContent=`Nvl ${estado.nivel} | ${estado.puntos}/${estado.puntosParaSubir}`}function renderizarMenu(){cont.style.display="flex";cont.innerHTML=`<div class="menu-grid"><div class="menu-titulo">AlgebraBelt</div><div class="menu-subtitulo">${estado.nivel>=2?"RANGO: MAESTRO SENIOR 🏆":"Aprendiz de Álgebra"}</div><button onclick="toggleModoTutorial()" style="display:flex;align-items:center;justify-content:space-between;width:100%;background:#1a1a2e;border:1px solid ${estado.modoTutorial?'#38bdf8':'#30363d'};border-radius:16px;padding:10px 14px;color:#cbd5e1;font-size:.85rem;cursor:pointer;margin-bottom:6px;"><span>🧠 Modo Tutorial</span><span style="background:${estado.modoTutorial?'#38bdf8':'#30363d'};border-radius:12px;width:44px;height:24px;position:relative;display:inline-block;transition:.3s;"><span style="position:absolute;top:2px;left:${estado.modoTutorial?'22px':'2px'};width:20px;height:20px;background:white;border-radius:50%;transition:.3s;"></span></span></button><button class="boton menu" style="width:100%" onclick="iniciarModo(1)">🔹 1. Factorización</button><button class="boton menu" style="width:100%" onclick="iniciarModo(2)">🔸 2. Productos Notables</button><button class="boton menu bloqueado" style="width:100%">🔺 3. Trigonometría (Próximamente)</button><button class="boton menu bloqueado" style="width:100%">🔻 4. Límites (Próximamente)</button><button class="boton menu bloqueado" style="width:100%">📐 5. Derivadas (Próximamente)</button><button class="boton dev" onclick="mostrarDevPanel()">🛠️ Modo Desarrollador</button
