<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para Mi Persona Favorita ❤️</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: #18081f; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 12px; overflow-x: hidden; }

  /* PORTADA DE BIENVENIDA */
  .portada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, #3b1050 0%, #18081f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 1000; text-align: center; padding: 20px; transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .portada.oculta { opacity: 0; transform: scale(1.1); pointer-events: none; }

  /* Contenedor del marco */
  .marco-foto {
    width: 170px; height: 170px; border-radius: 50%;
    border: 4px solid #f472b6; box-shadow: 0 0 25px rgba(244, 114, 182, 0.6);
    margin-bottom: 20px; position: relative; animation: flotar 3s ease-in-out infinite; flex-shrink: 0;
  }
  
  /* Foto centrada mediante Background-Image */
  .foto-fondo {
    width: 100%; height: 100%; border-radius: 50%;
    background-image: url('https://raw.githubusercontent.com/maikermedina1999-bot/Proyecto/1e8cdc29d97d524774122364e7868e838c97165b/amo.jpg');
    background-size: cover; background-position: center center; background-repeat: no-repeat;
  }

  .corazon-badge { position: absolute; bottom: 5px; right: 5px; font-size: 32px; animation: latido 1.2s infinite; z-index: 10; }

  @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes latido { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }

  .portada-titulo { color: #ffffff; font-size: 1.8rem; font-weight: 800; margin-bottom: 6px; text-shadow: 0 0 10px rgba(244, 114, 182, 0.5); }
  .portada-subtitulo { color: #f472b6; font-size: 1rem; font-weight: 500; margin-bottom: 30px; max-width: 280px; line-height: 1.4; }

  .btn-entrar {
    background: linear-gradient(90deg, #ec4899, #f43f5e);
    color: white; border: none; padding: 16px 36px; border-radius: 30px;
    font-size: 1.1rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 8px 25px rgba(244, 63, 94, 0.5); transition: all 0.2s ease;
  }
  .btn-entrar:active { transform: scale(0.95); }

  /* Corazones animados de fondo */
  .corazon-fondo { position: absolute; color: rgba(244, 114, 182, 0.3); font-size: 20px; animation: subir 6s linear infinite; bottom: -30px; }
  @keyframes subir { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; } }

  /* CONTENEDOR PRINCIPAL */
  .contenedor {
    width: 100%; max-width: 420px; background: #230d2e; border-radius: 32px;
    padding: 24px 16px; border: 1px solid rgba(244, 114, 182, 0.2);
    box-shadow: 0 20px 40px rgba(0,0,0,0.7); display: none; flex-direction: column; gap: 16px;
    text-align: center; color: white; max-height: 90vh; overflow-y: auto;
  }

  .header-app h2 { color: #f472b6; font-size: 1.3rem; margin-bottom: 4px; }
  .header-app p { color: #e2e8f0; font-size: 0.85rem; opacity: 0.8; }

  /* GRID DE BOTONES CIRCULARES (2 COLUMNAS / 5 FILAS) */
  .grid-circulos {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px 12px;
    justify-items: center;
    margin-top: 10px;
  }

  /* ITEM INDIVIDUAL (BOTÓN + ETIQUETA) */
  .item-boton {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  /* BOTÓN CIRCULAR CON EFECTO 3D REAL */
  .btn-circular {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(145deg, #f472b6, #e11d48);
    color: white;
    font-size: 1.4rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Sombra 3D de profundidad */
    box-shadow: 0 8px 0 #9f1239, 0 12px 15px rgba(0, 0, 0, 0.5);
    transition: all 0.1s ease;
    position: relative;
    outline: none;
  }

  /* EFECTO DE PRESIONAR EL BOTÓN */
  .btn-circular:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #9f1239, 0 4px 8px rgba(0, 0, 0, 0.5);
  }

  .etiqueta-boton {
    color: #fbcfe8;
    font-size: 0.75rem;
    font-weight: 600;
    max-width: 110px;
    text-align: center;
  }

  /* VISUALIZADOR DE MENSAJE */
  .tarjeta-mensaje {
    background: #341344; border: 1px solid #f472b6; border-radius: 20px;
    padding: 20px; margin-top: 10px; display: none; flex-direction: column; gap: 14px;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .texto-mensaje { color: #fbcfe8; font-size: 1rem; line-height: 1.5; font-style: italic; }
  .btn-volver {
    background: #f43f5e; color: white; border: none; border-radius: 12px;
    padding: 10px; font-weight: 700; cursor: pointer; margin-top: 10px;
  }
</style>
</head>
<body>

  <!-- PORTADA ESPECIAL -->
  <div class="portada" id="portada">
    <div id="corazonesContenedor"></div>
    
    <div class="marco-foto">
      <div class="foto-fondo" id="fotoAmor"></div>
      <div class="corazon-badge">💖</div>
    </div>

    <div class="portada-titulo">Hola, mi niña hermosa 💕</div>
    <div class="portada-subtitulo">Diseñé este pequeño rincón digital sólo para sacarte una sonrisa.</div>

    <button class="btn-entrar" id="btnEntrar">▶ Abrir mi Regalo</button>
  </div>

  <!-- PANTALLA PRINCIPAL CON LOS 10 BOTONES CIRCULARES -->
  <div class="contenedor" id="app">
    <div class="header-app">
      <h2>✨ Panel de Sorpresas ✨</h2>
      <p>Presiona cualquiera de los 10 botones:</p>
    </div>

    <!-- PANEL DE 10 BOTONES REDONDOS -->
    <div class="grid-circulos" id="listaBotones">
      
      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(1)">1</button>
        <span class="etiqueta-boton">💌 Razón de amor</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(2)">2</button>
        <span class="etiqueta-boton">☕ Recuerdo</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(3)">3</button>
        <span class="etiqueta-boton">👑 Lo que amo de ti</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(4)">4</button>
        <span class="etiqueta-boton">🎵 Canción</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(5)">5</button>
        <span class="etiqueta-boton">🫂 Abrazo</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(6)">6</button>
        <span class="etiqueta-boton">🌟 Deseo juntos</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(7)">7</button>
        <span class="etiqueta-boton">🤫 Secreto</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(8)">8</button>
        <span class="etiqueta-boton">🌹 Promesa</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(9)">9</button>
        <span class="etiqueta-boton">🎬 Cita ideal</span>
      </div>

      <div class="item-boton">
        <button class="btn-circular" onclick="mostrarDetalle(10)">10</button>
        <span class="etiqueta-boton">❤️ Mensaje final</span>
      </div>

    </div>

    <!-- MUESTRA EL DETALLE DEL BOTÓN SELECCIONADO -->
    <div class="tarjeta-mensaje" id="vistaMensaje">
      <div class="texto-mensaje" id="contenidoTexto"></div>
      <button class="btn-volver" onclick="cerrarDetalle()">↩ Volver a los botones</button>
    </div>
  </div>

<script>
  // Textos para cada uno de los 10 botones
  const mensajes = {
    1: "Amo la forma tan única en la que sonríes y cómo logras alegrar todo mi día con solo hablarme. ❤️",
    2: "Aquel día en el que nos quedamos platicando por horas sin darnos cuenta del tiempo. ¡Fue mágico! ☕✨",
    3: "Tu ternura, tu forma de cuidarme y esa mirada hermosa que me reconforta siempre. 🥰",
    4: "Cada vez que escucho nuestra canción favorita me recuerda a ti y a lo mucho que te extraño. 🎶💖",
    5: "¡Te envío un abrazo gigantesco! Imagíname apretándote super fuerte contra mí. 🫂💕",
    6: "Deseo seguir compartiendo miles de momentos, viajes y risas a tu lado por mucho tiempo más. 🌟",
    7: "Desde el primer momento en que te vi, supe que te convertirías en alguien muy importante para mi vida. 🤫❤️",
    8: "Te prometo estar siempre a tu lado, apoyándote en tus sueños y sacándote sonrisas cada día. 🌹",
    9: "Nuestra próxima cita incluirá tu comida preferida, una película romántica y muchos mimos. 🎬🍿",
    10: "No importa la hora ni el lugar, siempre serás mi persona favorita en todo el universo. Te amo. ♾️💖"
  };

  // Generar corazones flotantes en la portada
  const contenedorCorazones = document.getElementById('corazonesContenedor');
  for (let i = 0; i < 15; i++) {
    const corazon = document.createElement('div');
    corazon.classList.add('corazon-fondo');
    corazon.innerHTML = '❤️';
    corazon.style.left = Math.random() * 100 + 'vw';
    corazon.style.animationDuration = (Math.random() * 3 + 3) + 's';
    corazon.style.animationDelay = Math.random() * 2 + 's';
    corazon.style.fontSize = (Math.random() * 15 + 15) + 'px';
    contenedorCorazones.appendChild(corazon);
  }

  // Respaldar extensión .png
  const imgPrueba = new Image();
  imgPrueba.src = 'https://raw.githubusercontent.com/maikermedina1999-bot/Proyecto/1e8cdc29d97d524774122364e7868e838c97165b/amo.jpg';
  imgPrueba.onerror = function() {
    document.getElementById('fotoAmor').style.backgroundImage = "url('https://raw.githubusercontent.com/maikermedina1999-bot/Proyecto/1e8cdc29d97d524774122364e7868e838c97165b/amo.png')";
  };

  // Abrir app desde la portada
  document.getElementById('btnEntrar').addEventListener('click', () => {
    const portada = document.getElementById('portada');
    portada.classList.add('oculta');
    setTimeout(() => {
      portada.style.display = 'none';
      document.getElementById('app').style.display = 'flex';
    }, 800);
  });

  // Funciones para los 10 botones
  function mostrarDetalle(numero) {
    document.getElementById('listaBotones').style.display = 'none';
    document.getElementById('contenidoTexto').textContent = mensajes[numero];
    document.getElementById('vistaMensaje').style.display = 'flex';
  }

  function cerrarDetalle() {
    document.getElementById('vistaMensaje').style.display = 'none';
    document.getElementById('listaBotones').style.display = 'grid';
  }
</script>
</body>
</html>
